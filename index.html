<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04394b">
  <meta name="description" content="Okinawa 5D4N interactive travel book with itinerary, maps, tickets, checklist and editable notes.">
  <title>Okinawa 5D4N Journey Book</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="journey" id="app">
    <div class="grain"></div>
    <header class="appbar">
      <button class="nav-arrow" id="prevPage" type="button" aria-label="上一頁">‹</button>
      <div class="trip-id">
        <span>OKINAWA 5D4N</span>
        <strong id="screenTitle">Journey Book</strong>
      </div>
      <button class="nav-arrow next" id="nextPage" type="button" aria-label="下一頁">›</button>
    </header>

    <section class="viewport" id="viewport" aria-live="polite"></section>

    <nav class="bottom-nav" id="bottomNav" aria-label="主選單"></nav>
  </main>

  <dialog id="editDialog" class="modal">
    <form method="dialog" class="modal-card">
      <button class="modal-close" id="closeDialog" type="button" aria-label="關閉">×</button>
      <p class="label">EDIT MODE</p>
      <h2 id="editTitle">修改資料</h2>
      <div id="editBody"></div>
      <menu>
        <button class="ghost" id="cancelDialog" type="button">取消</button>
        <button class="ghost" id="restoreDefaults" type="button">恢復預設</button>
        <button class="save" type="submit">儲存</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
