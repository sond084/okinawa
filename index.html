<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06364a">
  <meta name="description" content="Okinawa 5D4N passport-style travel app with itinerary, maps, checklist and editable notes.">
  <title>Okinawa 5D4N Passport Atlas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="atlas-shell">
    <div class="sun-orb"></div>
    <div class="sea-lines"></div>

    <header class="topbar">
      <button id="prevBtn" class="round-btn" type="button" aria-label="上一頁">‹</button>
      <div class="brandmark">
        <span>OKINAWA 5D4N</span>
        <strong id="pageName">Passport Atlas</strong>
      </div>
      <button id="nextBtn" class="round-btn hot" type="button" aria-label="下一頁">›</button>
    </header>

    <section id="stage" class="stage" aria-live="polite"></section>

    <nav id="dock" class="dock" aria-label="頁面選單"></nav>
  </main>

  <dialog id="editor" class="editor">
    <form method="dialog" class="editor-card">
      <button class="close-btn" id="closeEdit" type="button" aria-label="關閉">×</button>
      <p class="eyebrow">LOCAL EDIT</p>
      <h2 id="editorTitle">修改資料</h2>
      <div id="editorBody"></div>
      <menu>
        <button value="cancel" class="ghost" type="button" id="cancelEdit">取消</button>
        <button value="default" class="ghost" type="button" id="resetEdit">恢復預設</button>
        <button value="save" class="primary" type="submit">儲存</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
